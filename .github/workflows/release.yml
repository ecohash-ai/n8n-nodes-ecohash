name: Release to npm
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          [ "$TAG" = "$PKG" ] || { echo "tag v$TAG != package.json $PKG"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Provenance requires a PUBLIC source repository — npm dropped support for
      # private ones in 2023, and n8n requires provenance for verified nodes as of
      # 2026-05-01. This step fails while the repo is private.
      #
      # After the first successful publish, switch to trusted publishing (OIDC):
      #   1. npmjs.com -> the package -> Settings -> Trusted Publisher -> add this
      #      repo + workflow (release.yml)
      #   2. delete the two `env:` lines below and the NPM_TOKEN secret
      #   3. drop `--provenance` (trusted publishing attests automatically)
      # A token cannot be avoided for the very first publish: the trusted-publisher
      # setting lives on the package, which does not exist yet.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
